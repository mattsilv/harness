name: budget
on: [pull_request, push]
jobs:
  agents-md-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: template/AGENTS.md stays within its word budget
        run: |
          budget=1065  # 1058 words at v24 (one bullet per rule; the extra "-" markers count as words); raise deliberately, never casually
          words=$(python3 -c "from importlib.machinery import SourceFileLoader as L; print(L('h', 'harness').load_module().strip_comments(open('template/AGENTS.md').read()))" | wc -w)
          echo "template/AGENTS.md: $words / $budget words"
          [ "$words" -le "$budget" ] || { echo "::error::AGENTS.md is $words words, over the $budget budget. Cut, move to an on-demand file, or raise the budget in this PR with a reason."; exit 1; }
  rule-ids:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: every rule in template/AGENTS.md has a unique id, a why, and a source
        run: |
          python3 - <<'PY'
          import re, sys
          lines = open("template/AGENTS.md").read().splitlines()
          ids, errors, in_comment = [], [], False
          for i, line in enumerate(lines):
              text = line.strip()
              starts, in_comment = in_comment or text.startswith("<!--"), False
              if starts:
                  in_comment = not text.endswith("-->")
                  continue
              if not text or text.startswith("#") or re.fullmatch(r"- \*\*[^*]+:\*\*", text):
                  continue  # blank, heading, or a group label with sub-bullets
              block = "\n".join(lines[i + 1:]).split("-->")[0]
              m = re.match(r"\s*<!-- ([a-z]+-\d+)\n", block + "\n")
              if not m:
                  errors.append(f"line {i + 1}: rule has no '<!-- <id>' comment on the next line")
                  continue
              if "why:" not in block or "source:" not in block:
                  errors.append(f"{m.group(1)}: missing why: or source:")
              ids.append(m.group(1))
          errors += [f"duplicate id {x}" for x in sorted({x for x in ids if ids.count(x) > 1})]
          print(f"{len(ids)} rules checked")
          for e in errors:
              print(f"::error::{e}")
          sys.exit(bool(errors))
          PY
  version-bump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: template/ changes bump VERSION and add a CHANGELOG line
        run: |
          base=${{ github.event.pull_request.base.sha }}
          git diff --quiet "$base" HEAD -- template/ && { echo "template/ unchanged"; exit 0; }
          old=$(git show "$base:VERSION" 2>/dev/null || echo 0); new=$(cat VERSION)
          [ "$new" -eq $((old + 1)) ] || { echo "::error::template/ changed: set VERSION to $((old + 1)) (is $new)."; exit 1; }
          grep -q "^- \*\*$new\*\* " CHANGELOG.md || { echo "::error::add a CHANGELOG.md line for version $new."; exit 1; }
          echo "VERSION $old → $new"
