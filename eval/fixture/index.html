<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-do</title>
</head>
<body>
  <h1>To-do</h1>
  <form id="add">
    <input id="text" aria-label="New task" autocomplete="off">
    <button>Add</button>
  </form>
  <ul id="list"></ul>
  <script>
    // Tasks persist in localStorage as [{id, text, done}].
    const KEY = "todos";
    let todos = JSON.parse(localStorage.getItem(KEY) || "[]");
    const list = document.getElementById("list");
    const input = document.getElementById("text");

    function save() {
      localStorage.setItem(KEY, JSON.stringify(todos));
      render();
    }

    function render() {
      list.replaceChildren(...todos.map((t) => {
        const li = document.createElement("li");
        const box = document.createElement("input");
        box.type = "checkbox";
        box.checked = t.done;
        box.setAttribute("aria-label", `Complete ${t.text}`);
        box.onchange = () => { t.done = box.checked; save(); };
        const label = document.createElement("span");
        label.textContent = t.text;
        const del = document.createElement("button");
        del.textContent = "Delete";
        del.setAttribute("aria-label", `Delete ${t.text}`);
        del.onclick = () => { todos = todos.filter((x) => x !== t); save(); };
        li.append(box, " ", label, " ", del);
        return li;
      }));
    }

    document.getElementById("add").onsubmit = (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      todos.push({ id: Date.now(), text, done: false });
      input.value = "";
      save();
    };

    render();
  </script>
</body>
</html>
